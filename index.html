<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B6B5D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Billing">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Shop Billing</title>
<style>
:root{--bg:#F3F5F4;--surface:#fff;--ink:#16201D;--muted:#64726E;--line:#D9E0DD;--accent:#0B6B5D;--accent-ink:#fff;--soft:#E1EFEB;--warn:#B4540A;--danger:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#0F1413;--surface:#192120;--ink:#E7EEEC;--muted:#8E9D99;--line:#2A3533;--accent:#3FBBA7;--accent-ink:#04211C;--soft:#16302B;--warn:#E8A15E;--danger:#F28B82}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
input.sp{font-size:20px;font-weight:700;border:2px solid var(--accent)}
input,select{width:100%;color:var(--ink);font-size:16px;font-weight:600;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{background:var(--accent);color:var(--accent-ink);padding:10px 14px 0;position:sticky;top:0;z-index:5}
[hidden]{display:none!important}
#pagebar{display:flex;align-items:center;gap:4px;padding:2px 0 10px;font-size:19px}
#backbtn{background:none;border:0;color:inherit;font-size:26px;line-height:1;padding:4px 12px 4px 0;cursor:pointer}
header .hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
#menubtn{background:none;border:0;color:inherit;font-size:26px;line-height:1;padding:6px 10px;margin-right:-8px;border-radius:10px;cursor:pointer}
#menubtn.on,#menubtn:active{background:rgba(255,255,255,.22)}
.menuwrap{position:fixed;inset:0;z-index:25}
.menu{position:absolute;top:54px;right:10px;min-width:230px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:6px}
.menu button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-radius:10px;padding:13px 12px;font-size:16px;font-weight:600;text-align:left;cursor:pointer;color:inherit}
.menu button:active,.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
header h1 small{font-size:12px;font-weight:400;opacity:.9;margin-left:10px}
nav{display:flex;gap:2px}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:9px 4px;color:inherit;opacity:.75;cursor:pointer;font-weight:600}
nav button.on{opacity:1;border-color:currentColor}
main{max-width:860px;margin:0 auto;padding:12px 12px 150px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dng{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>.btn{flex:none}
.muted{color:var(--muted)}
.tabs2{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.dt{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-weight:600;display:flex;gap:6px;align-items:center}
.dt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dt i{font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 7px;font-size:12px}
.dt .cx{opacity:.6;padding:0 2px}
.dt.add{border-style:dashed;background:none;color:var(--muted)}
.scanrow{display:flex;gap:8px;margin-bottom:6px}
.scanrow input{font-size:17px;padding:12px}
input::placeholder{font-weight:400;color:var(--muted)}
.sugg{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.sugg:empty{display:none}
.sugg div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.sugg div:last-child{border:0}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:2px dashed var(--line);border-radius:12px;margin-top:8px}
.line{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.lh{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:start}
.lh small{color:var(--muted)}
.lt{font-weight:700;font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--danger);font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.lf{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:8px}
.lf label,.fld label{font-size:12px;color:var(--muted);display:grid;gap:3px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px;z-index:4}
.bar>div{max-width:860px;margin:0 auto}
.sum{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}
.sum .bd{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sum .bd input{width:70px;padding:6px 8px}
.gt{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.sv{font-size:12px;color:var(--accent);font-weight:600}
.acts{display:flex;gap:8px}.acts .btn{flex:1}.acts .pri{flex:2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px}
.card .top{display:flex;justify-content:space-between;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.tile{background:var(--soft);border-radius:8px;padding:8px;text-align:center}
.tile small{display:block;color:var(--muted);font-size:11px}
.tile b{font-variant-numeric:tabular-nums;font-size:15px}
.tile.low{background:#fbe4cf;color:#7a3500}
.tile.out{background:var(--danger);color:#fff}.tile.out small{color:#fff}
.alertbar{background:#fbe4cf;color:#7a3500;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;font-weight:600}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.sc small{display:block;color:var(--muted);font-size:12px}
.sc b{font-size:20px;font-variant-numeric:tabular-nums}
.sc.big{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sc.big small{color:inherit;opacity:.85}.sc.big b{font-size:30px}
.srow{display:grid;grid-template-columns:1.3fr .6fr 1fr 1fr;gap:6px;padding:10px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:14px}
.srow span:nth-child(n+2){text-align:right}
.srow.h{color:var(--muted);font-weight:700;font-size:12px}
.nb{font-style:normal;background:#E8590C;color:#fff;border-radius:10px;padding:0 6px;font-size:12px;margin-left:4px}
@media (prefers-color-scheme:dark){.tile.low,.alertbar{background:#47290f;color:#ffd5ad}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:16px;max-height:92vh;overflow:auto}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0 0 2px;font-size:19px}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.fld .full{grid-column:1/-1}
.chips{display:flex;gap:6px}
.chip{flex:1;border:1px solid var(--line);background:none;border-radius:8px;padding:8px;cursor:pointer;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.warn{color:var(--warn);font-size:13px;min-height:18px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;max-width:90%;text-align:center}
.cam{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover;min-height:0}
.cam button{margin:12px}
h3{margin:18px 0 6px;font-size:15px}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1><span id="shopname">Shop</span><small id="syncst"></small></h1><button id="menubtn" aria-label="Menu">☰</button></div>
  <nav>
    <button data-v="bill">Billing</button>
    <button data-v="products">Products</button>
    <button data-v="history">Bills</button>
  </nav>
  <div id="pagebar" hidden><button id="backbtn" aria-label="Back">←</button><b id="pagetitle"></b></div>
</header>
<main id="main"></main>

<script>
/* ---------- storage (localStorage, falls back to memory if blocked) ---------- */
const KEY='shopbill_v1';
let memStore=null;
const DEF=()=>({settings:{shop:'My Shop',mobile:'',address:'',cur:'Rs.',footer:'Thank you! Come again.',paper:'80',low:5},products:[],bills:[],daily:{},nextNo:1,drafts:[],active:null,seq:1});
function load(){let s=null;try{s=localStorage.getItem(KEY)}catch(e){}if(!s)s=memStore;if(s){try{return Object.assign(DEF(),JSON.parse(s))}catch(e){}}return DEF()}
function save(){const s=JSON.stringify(S);memStore=s;try{localStorage.setItem(KEY,s)}catch(e){}}
let S=load();
let view='bill';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cs=()=>S.settings.cur||'Rs.';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet">'+html+'</div>';document.body.appendChild(m);m.addEventListener('mousedown',e=>{if(e.target===m)m.close()});m.close=()=>{m.remove();focusScan()};return m}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=[...document.querySelectorAll('.modal')].pop();if(m)m.close()}});
function focusScan(){const s=$('#scan');if(s&&matchMedia('(pointer:fine)').matches)s.focus()}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
let pfilter='all';
const lowLevel=p=>{const g=S.settings.low;return p.min>0?p.min:(g===''||g==null?5:num(g))};
const isOut=p=>p.stock<=0;
const isLow=p=>p.stock<=lowLevel(p);
const lowList=()=>S.products.filter(isLow);
function findProduct(code){const c=String(code).trim().toLowerCase();return S.products.find(p=>p.code.toLowerCase()===c)}

/* ---------- drafts (multiple bills at one time) ---------- */
function newDraft(){const d={id:uid(),label:'Bill '+S.seq++,lines:[],disc:0};S.drafts.push(d);S.active=d.id;save();return d}
function draft(){let d=S.drafts.find(x=>x.id===S.active);if(!d)d=S.drafts[0]||newDraft();S.active=d.id;return d}
function calc(d){
  let sub=0,mrp=0;
  d.lines.forEach(l=>{const net=l.price*(1-l.disc/100);sub+=net*l.qty;mrp+=l.mrp*l.qty});
  sub=r2(sub);const discAmt=r2(sub*(d.disc||0)/100);const grand=r2(sub-discAmt);
  return{sub,discAmt,grand,saved:r2(Math.max(0,mrp-grand))};
}
function addLine(p,qty,price,disc){
  const d=draft();
  const ex=d.lines.find(l=>l.code===p.code&&l.price===price&&l.disc===disc);
  if(ex)ex.qty=r2(ex.qty+qty);else d.lines.push({code:p.code,name:p.name,mrp:p.retail,price,disc,qty,cost:p.cost||0});
  save();render();
}

/* ---------- lookup + product dialog ---------- */
function onScan(code){
  code=code.trim();if(!code)return;
  const p=findProduct(code);
  if(p)return productDialog(p);
  const q=code.toLowerCase();
  const hits=S.products.filter(x=>x.name.toLowerCase().includes(q)||x.code.toLowerCase().includes(q));
  if(hits.length===1)return productDialog(hits[0]);
  if(hits.length>1){showSugg(code);return}
  const m=modal(`<h2>Product not found</h2><p class="muted">No product with code or name “${esc(code)}”.</p>
    <div class="acts"><button class="btn" id="c">Cancel</button><button class="btn pri" id="a">Add this product</button></div>`);
  $('#c',m).onclick=()=>m.close();
  $('#a',m).onclick=()=>{m.close();productForm(null,code)};
}
function showSugg(v){
  const box=$('#sugg');if(!box)return;
  const q=v.trim().toLowerCase();
  if(q.length<2){box.innerHTML='';return}
  const hits=S.products.filter(x=>x.name.toLowerCase().includes(q)||x.code.toLowerCase().includes(q)).slice(0,6);
  box.innerHTML=hits.map(h=>`<div data-c="${esc(h.code)}"><span>${esc(h.name)} <small class="muted">${esc(h.code)}</small></span><b>${money(h.retail)}</b></div>`).join('');
}
function productDialog(p){
  let type='retail';
  const m=modal(`<h2>${esc(p.name)}</h2><div class="muted">Code: ${esc(p.code)}</div>
    <div class="grid4">
      <div class="tile"><small>Cost</small><b>${money(p.cost)}</b></div>
      <div class="tile"><small>Wholesale</small><b>${money(p.wholesale)}</b></div>
      <div class="tile"><small>MRP</small><b>${money(p.retail)}</b></div>
      <div class="tile ${isOut(p)?'out':isLow(p)?'low':''}"><small>${isOut(p)?'Out of stock':'Stock'}</small><b>${p.stock}</b></div>
    </div>
    <div class="fld">
      <div class="full chips"><button class="chip on" data-t="retail">MRP price</button><button class="chip" data-t="wholesale">Wholesale price</button></div>
      <label>Quantity<input id="q" type="number" inputmode="decimal" value="1" min="0" step="any"></label>
      <label>Selling price (you can edit)<input id="p" class="sp" type="number" inputmode="decimal" value="${p.retail}" step="any"></label>
      <div class="full row" style="justify-content:space-between"><span class="muted" id="inf"></span><span class="lt" id="lt" style="font-size:20px"></span></div>
    </div>
    <div class="warn" id="w"></div>
    <div class="acts"><button class="btn" id="c">Cancel</button><button class="btn pri" id="ok">Add to bill</button></div>`);
  const q=$('#q',m),pr=$('#p',m);
  const upd=()=>{
    const t=r2(num(pr.value)*num(q.value));
    $('#lt',m).textContent=cs()+' '+money(t);
    const off=r2(p.retail-num(pr.value));
    $('#inf',m).textContent=off>0?`${cs()} ${money(off)} below MRP`:(off<0?`${cs()} ${money(-off)} above MRP`:'');
    $('#w',m).textContent=num(q.value)>p.stock?`Only ${p.stock} in stock.`:(isLow(p)?`Low stock: ${p.stock} left.`:'');
  };
  m.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    type=b.dataset.t;m.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
    pr.value=type==='retail'?p.retail:p.wholesale;upd();
  });
  [q,pr].forEach(i=>i.addEventListener('input',upd));
  pr.addEventListener('focus',()=>pr.select());
  const ok=()=>{
    const qty=num(q.value);if(qty<=0){toast('Enter a quantity');return}
    if(!(num(pr.value)>=0)||pr.value==='')return toast('Enter a selling price');
    m.remove();addLine(p,qty,num(pr.value),0);focusScan();
  };
  $('#ok',m).onclick=ok;$('#c',m).onclick=()=>m.close();
  m.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ok()}});
  upd();q.focus();q.select();
}

/* ---------- camera barcode scan ---------- */
async function camScan(cb){
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices){toast('Camera scan needs Chrome on Android. A USB / Bluetooth scanner works everywhere.');return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){toast('Camera permission blocked');return}
  const det=new BarcodeDetector();
  const ov=document.createElement('div');ov.className='cam';
  ov.innerHTML='<video playsinline muted autoplay></video><button class="btn">Close camera</button>';
  document.body.appendChild(ov);
  const v=$('video',ov);v.srcObject=stream;
  let stop=false;
  const close=()=>{stop=true;stream.getTracks().forEach(t=>t.stop());ov.remove()};
  $('button',ov).onclick=close;
  const tick=async()=>{
    if(stop)return;
    try{const r=await det.detect(v);if(r.length){close();cb(r[0].rawValue);return}}catch(e){}
    setTimeout(tick,250);
  };
  v.onloadedmetadata=tick;
}

/* ---------- billing view ---------- */
function vBill(m){
  const d=draft();
  m.innerHTML=`<div class="tabs2">${S.drafts.map(x=>`<button class="dt ${x.id===d.id?'on':''}" data-id="${x.id}">${esc(x.label)}${x.lines.length?` <i>${x.lines.length}</i>`:''}<span class="cx" data-close="${x.id}">×</span></button>`).join('')}<button class="dt add" id="newbill">+ New bill</button></div>
  ${lowList().length?`<div class="alertbar" id="alertbar"><span>⚠ ${lowList().length} item${lowList().length>1?'s':''} low in stock</span><span>View</span></div>`:''}
  <div class="scanrow"><input id="scan" placeholder="Code, name or scan" autocomplete="off" enterkeyhint="search"><button class="btn" id="cam">Camera</button></div>
  <div id="sugg" class="sugg"></div>
  <div id="lines"></div>
  <div class="bar"><div>
    <div class="sum">
      <div><div class="muted" style="font-size:12px">Total</div><div class="gt" id="gt"></div><div class="sv" id="sv"></div></div>
    </div>
    <div class="acts"><button class="btn dng" id="clr">Clear</button><button class="btn" id="sv1">Save</button><button class="btn pri" id="sp">Save &amp; Print</button></div>
  </div></div>`;
  renderLines();
  const scan=$('#scan');
  scan.addEventListener('input',()=>showSugg(scan.value));
  scan.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=scan.value;scan.value='';$('#sugg').innerHTML='';onScan(v)}});
  $('#sugg').onclick=e=>{const t=e.target.closest('[data-c]');if(!t)return;scan.value='';$('#sugg').innerHTML='';productDialog(findProduct(t.dataset.c))};
  $('#cam').onclick=()=>camScan(onScan);
  const ab=$('#alertbar');if(ab)ab.onclick=()=>{pfilter='low';view='products';render()};
  m.querySelector('.tabs2').onclick=e=>{
    const c=e.target.closest('[data-close]');
    if(c){e.stopPropagation();closeDraft(c.dataset.close);return}
    if(e.target.id==='newbill'){newDraft();render();return}
    const t=e.target.closest('[data-id]');if(t){S.active=t.dataset.id;save();render()}
  };
  $('#clr').onclick=()=>{if(d.lines.length&&!confirm('Remove all items from this bill?'))return;d.lines=[];d.disc=0;save();render()};
  $('#sv1').onclick=()=>finish(false);
  $('#sp').onclick=()=>finish(true);
  focusScan();
}
function closeDraft(id){
  const x=S.drafts.find(a=>a.id===id);if(!x)return;
  if(x.lines.length&&!confirm('Close '+x.label+' without saving?'))return;
  S.drafts=S.drafts.filter(a=>a.id!==id);
  if(!S.drafts.length)newDraft();else if(S.active===id)S.active=S.drafts[0].id;
  save();render();
}
function renderLines(){
  const d=draft(),box=$('#lines');
  if(!d.lines.length){box.innerHTML='<div class="empty">No items yet.<br>Scan a barcode or type a product code above.</div>';totals();return}
  box.innerHTML=d.lines.map((l,i)=>`<div class="line" data-i="${i}">
    <div class="lh"><div><b>${esc(l.name)}</b><br><small>${esc(l.code)} · MRP ${money(l.mrp)}</small></div><div class="lt" id="lt${i}"></div><button class="x" data-rm="${i}" aria-label="Remove">×</button></div>
    <div class="lf">
      <label>Qty<input data-f="qty" type="number" inputmode="decimal" step="any" value="${l.qty}"></label>
      <label>Selling price<input data-f="price" type="number" inputmode="decimal" step="any" value="${l.price}"></label>
    </div></div>`).join('');
  box.oninput=e=>{
    const f=e.target.dataset.f,row=e.target.closest('.line');if(!f||!row)return;
    const l=d.lines[+row.dataset.i];
    l[f]=f==='disc'?Math.min(100,Math.max(0,num(e.target.value))):num(e.target.value);
    save();totals();
  };
  box.onclick=e=>{const r=e.target.closest('[data-rm]');if(r){d.lines.splice(+r.dataset.rm,1);save();render()}};
  totals();
}
function totals(){
  const d=draft(),c=calc(d);
  d.lines.forEach((l,i)=>{const e=$('#lt'+i);if(e)e.textContent=cs()+' '+money(r2(l.price*(1-l.disc/100)*l.qty))});
  const g=$('#gt');if(g)g.textContent=cs()+' '+money(c.grand);
  const s=$('#sv');if(s)s.textContent=c.saved>0?`Customer saves ${cs()} ${money(c.saved)}`:'';
}
function finish(print){
  const d=draft();
  if(!d.lines.length){toast('Add at least one item');return}
  if(d.lines.some(l=>!(l.qty>0))){toast('Quantity must be more than 0');return}
  const low=d.lines.filter(l=>{const p=findProduct(l.code);return p&&l.qty>p.stock});
  if(low.length&&!confirm('Stock is lower than the quantity for: '+low.map(l=>l.name).join(', ')+'.\nSave anyway?'))return;
  if(!canWrite())return;
  const c=calc(d);
  const bill={id:uid(),no:nextBillNo(),date:new Date().toISOString(),lines:d.lines.map(l=>({...l})),disc:d.disc||0,sub:c.sub,discAmt:c.discAmt,grand:c.grand,saved:c.saved};
  const sold={};d.lines.forEach(l=>{sold[l.code]=(sold[l.code]||0)+l.qty});
  const alerts=Object.keys(sold).map(code=>{const p=findProduct(code);return p&&{...p,stock:r2(Math.max(0,p.stock-sold[code]))}}).filter(p=>p&&isLow(p));
  d.lines.forEach(l=>store.adjustStock(l.code,-l.qty));
  store.addBill(bill);
  S.drafts=S.drafts.filter(x=>x.id!==d.id);
  if(!S.drafts.length)newDraft();else S.active=S.drafts[0].id;
  save();render();
  toast('Bill #'+bill.no+' saved');
  if(print)printBill(bill);
  if(alerts.length){
    const m=modal(`<h2>Stock alert</h2><p class="muted">Time to re-order:</p>${alerts.map(p=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(p.name)}</span><b style="color:var(--${isOut(p)?'danger':'warn'})">${isOut(p)?'Out of stock':p.stock+' left'}</b></div>`).join('')}<div class="acts" style="margin-top:14px"><button class="btn pri" id="ok">OK</button></div>`);
    $('#ok',m).onclick=()=>m.close();
  }
}

function parseCSV(t){
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){r.push(f);f=''}
    else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}
    else if(c!=='\r')f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows;
}

/* ---------- data layer: this phone only, or shared through Firebase ---------- */
const CFG_KEY='shopbill_fbcfg',FB_VER='10.12.2',SHARED=['shop','mobile','address','cur','footer','low'];
const cloud={state:'off',user:null,auth:null,authM:null,db:null,fs:null,unsubs:[],pendP:false,pendB:false,dirty:new Set(),timer:null};
const pid=c=>encodeURIComponent(String(c).trim().toLowerCase());
const devPrefix=()=>{try{return localStorage.getItem('shopbill_dev')||'A'}catch(e){return 'A'}};
const setDevPrefix=v=>{try{localStorage.setItem('shopbill_dev',v)}catch(e){}};
function getCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch(e){return null}}
function parseCfg(t){const o={};String(t).replace(/["']?([A-Za-z0-9_]+)["']?\s*:\s*["']([^"']*)["']/g,(m,k,v)=>{o[k]=v;return m});return(o.apiKey&&o.projectId)?o:null}
const ucol=n=>cloud.fs.collection(cloud.db,'users',cloud.user.uid,n);
const uprod=c=>cloud.fs.doc(cloud.db,'users',cloud.user.uid,'products',pid(c));
const ubill=id=>cloud.fs.doc(cloud.db,'users',cloud.user.uid,'bills',String(id));
const udaily=k=>cloud.fs.doc(cloud.db,'users',cloud.user.uid,'daily',k);
const uset=()=>cloud.fs.doc(cloud.db,'users',cloud.user.uid,'meta','settings');
let lastErr=0;
function cloudErr(e){console.error(e);if(Date.now()-lastErr<5000)return;lastErr=Date.now();toast(e&&e.code==='permission-denied'?'Cloud rules block this. Check the Firestore rules.':'Cloud problem: '+((e&&e.code)||'unknown'))}
function canWrite(){
  if(cloud.state==='loading'){toast('Connecting to cloud… try again in a moment');return false}
  if(cloud.state==='failed'){toast('Cloud not connected. Open the app with internet once, or use this phone only (Settings).');return false}
  return true;
}
function nextBillNo(){const n=S.nextNo++;return cloud.state==='in'?devPrefix()+'-'+n:n}
const inCloud=()=>cloud.state==='in';
const store={
  saveProduct(old,v){
    if(!canWrite())return false;
    if(inCloud()){
      const b=cloud.fs.writeBatch(cloud.db),sameDoc=old&&pid(old.code)===pid(v.code);
      if(old&&!sameDoc)b.delete(uprod(old.code));
      if(sameDoc){const o={...v};if(o.stock===old.stock)delete o.stock;b.set(uprod(v.code),o,{merge:true})}
      else b.set(uprod(v.code),v);
      b.commit().catch(cloudErr);
    }else{
      if(!old)S.products.push(v);else Object.assign(old,v);
      save();
    }
    return true;
  },
  deleteProduct(code){
    if(!canWrite())return false;
    if(inCloud())cloud.fs.deleteDoc(uprod(code)).catch(cloudErr);
    else{S.products=S.products.filter(x=>x.code!==code);save()}
    return true;
  },
  bulkUpsert(list){
    if(!canWrite())return false;
    if(inCloud()){
      for(let i=0;i<list.length;i+=400){
        const b=cloud.fs.writeBatch(cloud.db);
        list.slice(i,i+400).forEach(p=>b.set(uprod(p.code),p,{merge:true}));
        b.commit().catch(cloudErr);
      }
    }else{
      list.forEach(p=>{const ex=findProduct(p.code);if(ex)Object.assign(ex,p);else S.products.push(p)});
      save();
    }
    return true;
  },
  adjustStock(code,delta){
    if(inCloud())cloud.fs.updateDoc(uprod(code),{stock:cloud.fs.increment(delta)}).catch(cloudErr);
    else{const p=findProduct(code);if(p)p.stock=r2(Math.max(0,p.stock+delta))}
  },
  addBill(b){
    if(inCloud()){
      const f=cloud.fs,t=billTotals(b),k=dayKey(b.date),bt=f.writeBatch(cloud.db);
      bt.set(ubill(b.id),b);
      bt.set(udaily(k),dailyInc(k,t,1),{merge:true});
      bt.commit().catch(cloudErr);
    }else{S.bills.unshift(b);save()}
  },
  voidBill(b){
    if(!canWrite())return false;
    b.lines.forEach(l=>store.adjustStock(l.code,l.qty));
    if(inCloud()){
      const f=cloud.fs,bt=f.writeBatch(cloud.db),k=dayKey(b.date);
      bt.delete(ubill(b.id||b.no));
      bt.set(udaily(k),dailyInc(k,billTotals(b),-1),{merge:true});
      bt.commit().catch(cloudErr);
    }else{S.bills=S.bills.filter(x=>x!==b);save()}
    return true;
  },
  settingChanged(k){
    save();
    if(!inCloud()||!SHARED.includes(k))return;
    cloud.dirty.add(k);clearTimeout(cloud.timer);
    cloud.timer=setTimeout(()=>{
      const o={};SHARED.forEach(x=>o[x]=S.settings[x]);
      cloud.fs.setDoc(uset(),o,{merge:true}).then(()=>cloud.dirty.clear()).catch(cloudErr);
    },600);
  }
};
function setStatus(){
  const el=$('#syncst');if(!el)return;
  const t={loading:'☁ connecting…',failed:'☁ not connected',out:'☁ not signed in'}[cloud.state]||'';
  el.textContent=cloud.state==='in'?(!navigator.onLine?'☁ offline - saved on this phone':(cloud.pendP||cloud.pendB?'☁ syncing…':'☁ synced')):t;
}
function afterSync(){
  save();setStatus();
  const a=document.activeElement;
  const busy=document.querySelector('.modal')||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#main').contains(a)&&a.value!=='');
  if(busy){$('#shopname').textContent=S.settings.shop||'Shop';const nb=lowList().length;$('nav [data-v=products]').innerHTML='Products'+(nb?`<i class="nb">${nb}</i>`:'');return}
  render();
}
function startListeners(){
  stopListeners();
  const f=cloud.fs;
  cloud.unsubs.push(f.onSnapshot(ucol('products'),snap=>{
    S.products=snap.docs.map(d=>{const p=d.data();p.stock=Math.round(num(p.stock)*1000)/1000;return p}).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
    cloud.pendP=!!(snap.metadata&&snap.metadata.hasPendingWrites);afterSync();
  },cloudErr));
  cloud.unsubs.push(f.onSnapshot(f.query(ucol('bills'),f.orderBy('date','desc'),f.limit(100)),snap=>{
    S.bills=snap.docs.map(d=>d.data());
    cloud.pendB=!!(snap.metadata&&snap.metadata.hasPendingWrites);afterSync();
  },cloudErr));
  cloud.unsubs.push(f.onSnapshot(f.query(ucol('daily'),f.where('day','>=',(new Date().getFullYear()-1)+'-01-01')),snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S.daily=o;afterSync();
  },cloudErr));
  cloud.unsubs.push(f.onSnapshot(uset(),sn=>{
    if(sn.exists()){const d=sn.data();SHARED.forEach(k=>{if(d[k]!==undefined&&!cloud.dirty.has(k))S.settings[k]=d[k]})}
    afterSync();
  },cloudErr));
}
function stopListeners(){cloud.unsubs.forEach(u=>{try{u()}catch(e){}});cloud.unsubs=[]}
async function migrateLocal(){
  const flag='shopbill_mig_'+cloud.user.uid;
  try{if(localStorage.getItem(flag))return}catch(e){}
  const f=cloud.fs;
  const snap=await f.getDocs(ucol('products'));
  const have=new Set(snap.docs.map(d=>d.id));
  const mine=S.products.filter(p=>!have.has(pid(p.code)));
  for(let i=0;i<mine.length;i+=400){const b=f.writeBatch(cloud.db);mine.slice(i,i+400).forEach(p=>b.set(uprod(p.code),p));await b.commit()}
  const sd=await f.getDocs(ucol('meta'));
  if(sd.empty){const o={};SHARED.forEach(k=>o[k]=S.settings[k]);await f.setDoc(uset(),o)}
  const bs=await f.getDocs(ucol('bills'));
  if(bs.empty&&S.bills.length){for(let i=0;i<S.bills.length;i+=400){const b=f.writeBatch(cloud.db);S.bills.slice(i,i+400).forEach(x=>{x.id=x.id||uid();b.set(ubill(x.id),x)});await b.commit()}}
  try{localStorage.setItem(flag,'1')}catch(e){}
  if(mine.length)toast(mine.length+' products from this phone were added to the cloud');
}
async function cloudInit(){
  const cfg=getCfg();
  if(!cfg){setStatus();return}
  cloud.state='loading';setStatus();
  try{
    const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [A,Au,Fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const app=A.initializeApp(cfg);
    cloud.auth=Au.getAuth(app);cloud.authM=Au;cloud.fs=Fs;
    cloud.db=Fs.initializeFirestore(app,{localCache:Fs.persistentLocalCache({tabManager:Fs.persistentMultipleTabManager()})});
    Au.onAuthStateChanged(cloud.auth,async user=>{
      cloud.user=user;
      if(user){cloud.state='in';try{await migrateLocal()}catch(e){console.error(e)}try{await ensureDaily()}catch(e){console.error(e)}startListeners()}
      else{stopListeners();cloud.state='out'}
      setStatus();render();
    });
  }catch(e){console.error(e);cloud.state='failed';setStatus();if(view==='cloud')render()}
}
function authMsg(e){
  const c=e&&e.code||'';
  if(c==='auth/email-already-in-use')return 'This email already has an account. Tap Sign in.';
  if(/invalid-credential|wrong-password|user-not-found/.test(c))return 'Wrong email or password.';
  if(c==='auth/weak-password')return 'Password needs 6 or more letters.';
  if(c==='auth/invalid-email')return 'That email does not look right.';
  if(c==='auth/operation-not-allowed')return 'Turn on Email/Password sign-in in Firebase first.';
  if(c==='auth/network-request-failed')return 'No internet.';
  return 'Sign-in problem: '+c;
}
async function cloudAuth(mode,email,pass){
  try{
    if(mode==='new')await cloud.authM.createUserWithEmailAndPassword(cloud.auth,email,pass);
    else await cloud.authM.signInWithEmailAndPassword(cloud.auth,email,pass);
  }catch(e){toast(authMsg(e))}
}
function cloudCard(){
  const st=cloud.state;
  let h='<div class="card" id="cloudcard">';
  if(st==='off')h+=`<p class="muted" style="margin:0 0 8px">Same products, bills and stock on every phone. Paste your Firebase config here (one time on each phone).</p>
    <textarea id="cfgtxt" rows="6" placeholder='const firebaseConfig = { apiKey: "...", projectId: "..." }' style="width:100%;font:13px monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)"></textarea>
    <div class="acts" style="margin-top:8px"><button class="btn pri" id="cfgsave">Save &amp; connect</button></div>`;
  else if(st==='loading')h+='<p style="margin:0">Connecting…</p>';
  else if(st==='failed')h+=`<p class="warn">Could not load the cloud. Connect this phone to the internet once.</p><div class="acts"><button class="btn" id="cloudretry">Try again</button><button class="btn dng" id="cloudoff">Use this phone only</button></div>`;
  else if(st==='out')h+=`<div class="fld"><label class="full">Email<input id="cem" type="email" autocomplete="username"></label><label class="full">Password (6+ letters)<input id="cpw" type="password" autocomplete="current-password"></label></div>
    <div class="acts"><button class="btn" id="cloudnew">Create shop account</button><button class="btn pri" id="cloudin">Sign in</button></div>
    <p class="muted" style="font-size:13px">First phone: Create shop account. Other phones: Sign in with the same email and password.</p>
    <div class="acts"><button class="btn dng sm" id="cloudoff">Remove cloud setup</button></div>`;
  else h+=`<p style="margin:0 0 8px">✅ Connected as <b>${esc(cloud.user&&cloud.user.email)}</b></p>
    <div class="fld"><label class="full">This phone's bill letter (A, B, C…)<input id="devp" maxlength="3" value="${esc(devPrefix())}"></label></div>
    <div class="acts"><button class="btn" id="cloudout">Sign out</button></div>`;
  return h+'</div>';
}
function wireCloudCard(m){
  const cc=$('#cloudcard',m);if(!cc)return;
  cc.onclick=async e=>{
    const id=e.target.id;
    if(id==='cfgsave'){
      const cfg=parseCfg($('#cfgtxt').value);
      if(!cfg){toast('Could not read it. Paste the whole firebaseConfig block.');return}
      try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg))}catch(err){toast('This browser cannot save the setup');return}
      location.reload();
    }else if(id==='cloudoff'){
      if(confirm('Turn off cloud sync on this phone?')){try{localStorage.removeItem(CFG_KEY)}catch(err){}location.reload()}
    }else if(id==='cloudretry')location.reload();
    else if(id==='cloudnew'||id==='cloudin'){
      const em=$('#cem').value.trim(),pw=$('#cpw').value;
      if(!em||!pw){toast('Enter email and password');return}
      await cloudAuth(id==='cloudnew'?'new':'in',em,pw);
    }else if(id==='cloudout'){
      if(confirm('Sign out? This phone will work alone until you sign in again.'))await cloud.authM.signOut(cloud.auth);
    }
  };
}
addEventListener('online',setStatus);addEventListener('offline',setStatus);

/* ---------- sales summary: daily / monthly / yearly ---------- */
let rmode='day',rpick=null;
const pad2=n=>String(n).padStart(2,'0');
const dayKey=d=>{d=new Date(d);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
function billTotals(b){
  let qty=0,cost=0;
  b.lines.forEach(l=>{const c=l.cost!=null?l.cost:((findProduct(l.code)||{}).cost||0);qty+=l.qty;cost+=c*l.qty});
  return {sales:b.grand,bills:1,qty:r2(qty),saved:b.saved||0,cost:r2(cost)};
}
function dailyInc(k,t,sign){
  const inc=cloud.fs.increment;
  return {day:k,sales:inc(sign*t.sales),bills:inc(sign*t.bills),qty:inc(sign*t.qty),saved:inc(sign*t.saved),cost:inc(sign*t.cost)};
}
function getDaily(){
  if(inCloud())return S.daily||{};
  const o={};
  S.bills.forEach(b=>{const k=dayKey(b.date),t=billTotals(b),d=o[k]||(o[k]={sales:0,bills:0,qty:0,saved:0,cost:0});for(const x in t)d[x]=r2(d[x]+t[x])});
  return o;
}
async function rebuildDaily(){
  const f=cloud.fs,days={};
  (await f.getDocs(ucol('bills'))).docs.forEach(d=>{
    const b=d.data(),k=dayKey(b.date),t=billTotals(b),x=days[k]||(days[k]={day:k,sales:0,bills:0,qty:0,saved:0,cost:0});
    for(const q in t)x[q]=r2(x[q]+t[q]);
  });
  const ops=[];
  (await f.getDocs(ucol('daily'))).docs.forEach(d=>{if(!days[d.id])ops.push(['d',d.id])});
  Object.keys(days).forEach(k=>ops.push(['s',k]));
  for(let i=0;i<ops.length;i+=400){
    const b=f.writeBatch(cloud.db);
    ops.slice(i,i+400).forEach(([t,k])=>t==='d'?b.delete(udaily(k)):b.set(udaily(k),days[k]));
    await b.commit();
  }
}
async function ensureDaily(){
  const f=cloud.fs;
  if((await f.getDocs(ucol('meta'))).docs.some(d=>d.id==='dailyv1'))return;
  await rebuildDaily();
  await f.setDoc(f.doc(cloud.db,'users',cloud.user.uid,'meta','dailyv1'),{at:Date.now()});
}
function sumOf(rows){const t={sales:0,bills:0,qty:0,saved:0,cost:0};rows.forEach(r=>{for(const k in t)t[k]=r2(t[k]+num(r[k]))});return t}
function vSummary(m){
  const today=dayKey(new Date());
  const pick=rpick||(rmode==='day'?today:rmode==='month'?today.slice(0,7):today.slice(0,4));
  const D=getDaily();
  const keys=Object.keys(D).filter(k=>k.startsWith(pick)).sort();
  const T=sumOf(keys.map(k=>D[k])),profit=r2(T.sales-T.cost),c=cs();
  const picker=rmode==='day'?`<input type="date" id="rp" value="${pick}">`:rmode==='month'?`<input type="month" id="rp" value="${pick}">`:`<input type="number" id="rp" value="${pick}" min="2020" max="2100">`;
  const rw=(a,b,c2,d,cls)=>`<div class="srow ${cls||''}"><span>${a}</span><span>${b}</span><span>${c2}</span><span>${d}</span></div>`;
  let detail='';
  if(rmode==='month'&&keys.length)detail=rw('Day','Bills','Sales','Profit','h')+keys.map(k=>rw(new Date(k+'T00:00:00').toLocaleDateString([], {day:'numeric',month:'short',weekday:'short'}),D[k].bills,money(D[k].sales),money(r2(D[k].sales-D[k].cost)))).join('');
  if(rmode==='year'&&keys.length){
    const g={};keys.forEach(k=>{const mk=k.slice(0,7),x=g[mk]||(g[mk]={sales:0,bills:0,cost:0});x.sales=r2(x.sales+num(D[k].sales));x.bills+=num(D[k].bills);x.cost=r2(x.cost+num(D[k].cost))});
    detail=rw('Month','Bills','Sales','Profit','h')+Object.keys(g).sort().map(mk=>rw(new Date(mk+'-01T00:00:00').toLocaleDateString([], {month:'long'}),g[mk].bills,money(g[mk].sales),money(r2(g[mk].sales-g[mk].cost)))).join('');
  }
  if(rmode==='day'){
    const list=S.bills.filter(b=>dayKey(b.date)===pick);
    if(list.length)detail=rw('Bill','Items','Time','Total','h')+list.map(b=>rw('#'+esc(b.no),b.lines.length,new Date(b.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),money(b.grand))).join('');
  }
  const old=inCloud()&&Number(pick.slice(0,4))<new Date().getFullYear()-1;
  m.innerHTML=`<div class="chips"><button class="chip ${rmode==='day'?'on':''}" data-rm="day">Daily</button><button class="chip ${rmode==='month'?'on':''}" data-rm="month">Monthly</button><button class="chip ${rmode==='year'?'on':''}" data-rm="year">Yearly</button></div>
  <div style="margin-top:10px">${picker}</div>
  ${old?'<p class="muted" style="font-size:13px">Only this year and last year are shown here.</p>':''}
  ${T.bills?`<div class="sg">
    <div class="sc big"><small>Total sales</small><b>${c} ${money(T.sales)}</b></div>
    <div class="sc"><small>Profit (estimated)</small><b>${c} ${money(profit)}</b></div>
    <div class="sc"><small>Bills</small><b>${T.bills}</b></div>
    <div class="sc"><small>Items sold</small><b>${Math.round(T.qty*1000)/1000}</b></div>
    <div class="sc"><small>Average bill</small><b>${c} ${money(T.bills?r2(T.sales/T.bills):0)}</b></div>
    <div class="sc"><small>Customers saved</small><b>${c} ${money(T.saved)}</b></div>
  </div>${detail}<p class="muted" style="font-size:12px;margin-top:12px">Profit = selling price minus cost price of the items sold.</p>`:'<div class="empty">No sales for this period.</div>'}
  ${inCloud()?'<div class="acts" style="margin-top:14px"><button class="btn sm" id="rb">Recalculate from bills</button></div>':''}`;
  m.onclick=async e=>{
    const r=e.target.closest('[data-rm]');if(r){rmode=r.dataset.rm;rpick=null;render();return}
    if(e.target.id==='rb'){try{toast('Recalculating…');await rebuildDaily();toast('Summary updated')}catch(err){cloudErr(err)}}
  };
  m.onchange=e=>{if(e.target.id==='rp'&&e.target.value){rpick=e.target.value;render()}};
}

/* ---------- boot ---------- */
function render(){
  $('#shopname').textContent=S.settings.shop||'Shop';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const pg=PAGES[view];
  document.querySelector('nav').hidden=!!pg;$('#pagebar').hidden=!pg;$('#pagetitle').textContent=pg||'';
  $('#menubtn').classList.toggle('on',!!pg);
  const nb=lowList().length;$('nav [data-v=products]').innerHTML='Products'+(nb?`<i class="nb">${nb}</i>`:'');
  const m=$('#main');m.onclick=m.oninput=m.onchange=null;
  ({bill:vBill,products:vProducts,history:vHistory,summary:vSummary,settings:vSettings,cloud:vCloud,backup:vBackup})[view](m);
}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;render();scrollTo(0,0)}};
/* ☰ menu: Summary, Settings, Cloud sync, Backup - each opens as its own page with a back arrow */
const PAGES={summary:'Summary',settings:'Settings',cloud:'Cloud sync',backup:'Backup'};
let prevView='bill',pageOpen=false;
function closeMenu(){const m=$('#menuwrap');if(m)m.remove()}
function openPage(k){
  if(!PAGES[view])prevView=view;
  view=k;
  if(!pageOpen){try{history.pushState({pg:1},'')}catch(e){}pageOpen=true}
  render();scrollTo(0,0);
}
function leavePage(){if(!PAGES[view])return;view=prevView||'bill';pageOpen=false;render();scrollTo(0,0)}
$('#backbtn').onclick=()=>{if(history.state&&history.state.pg)history.back();else leavePage()};
addEventListener('popstate',()=>{if(PAGES[view])leavePage()});
$('#menubtn').onclick=()=>{
  if($('#menuwrap'))return closeMenu();
  const w=document.createElement('div');w.id='menuwrap';w.className='menuwrap';
  w.innerHTML=`<div class="menu">
    <button data-go="summary">📊 Summary</button>
    <button data-go="settings">⚙️ Settings</button>
    <hr>
    <button data-go="cloud">☁️ Cloud sync</button>
    <button data-go="backup">💾 Backup</button></div>`;
  w.onclick=e=>{const b=e.target.closest('[data-go]');closeMenu();if(b)openPage(b.dataset.go)};
  document.body.appendChild(w);
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
if(!S.drafts.length)newDraft();
render();
cloudInit();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
